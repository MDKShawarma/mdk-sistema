<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDK Shawarma - Hacer Pedido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #1a1a1a; color: white; min-height: 100vh; padding-bottom: 100px; }
        
        .header {
            background-color: #121212;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #f4a460;
        }
        .header h1 { color: #f4a460; font-size: 26px; margin-bottom: 5px; }
        .header p { color: #aaa; font-size: 14px; }
        
        .content { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        .categoria-titulo {
            color: #f4a460;
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0 15px 0;
            padding: 10px;
            background-color: #121212;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #f4a460;
        }
        
        .producto {
            background-color: #121212;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .producto.activo {
            border-color: #4CAF50;
            background-color: #1a2a1a;
        }
        
        .producto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .producto-info { flex: 1; }
        .producto-nombre { font-size: 17px; font-weight: bold; margin-bottom: 5px; }
        .producto-precio { color: #f4a460; font-size: 16px; font-weight: bold; }
        
        .cantidad-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .btn-cantidad {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-restar { background-color: #f44336; color: white; }
        .btn-restar:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        .btn-sumar { background-color: #4CAF50; color: white; }
        .btn-cantidad:active { transform: scale(0.95); }
        
        .cantidad {
            font-size: 22px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        
        /* PERSONALIZACIÓN */
        .personalizacion {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #444;
        }
        .personalizacion.visible { display: block; }
        
        .personalizacion-titulo {
            color: #f4a460;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .opciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .opcion-check {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #ccc;
            user-select: none;
        }
        .opcion-check.seleccionada {
            border-color: #f44336;
            background-color: #2a1a1a;
            color: #fff;
            font-weight: bold;
        }
        
        /* CARRITO FIJO ABAJO */
        .carrito-fijo {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121212;
            border-top: 3px solid #f4a460;
            padding: 15px;
            z-index: 20;
        }
        
        .carrito-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .carrito-total .label { color: #aaa; }
        .carrito-total .monto { color: #f4a460; font-weight: bold; font-size: 24px; }
        
        .btn-confirmar {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-confirmar:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        .btn-confirmar:active { transform: scale(0.98); }
        
        /* FORMULARIO */
        .formulario {
            background-color: #121212;
            border: 2px solid #f4a460;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        .formulario h2 {
            color: #f4a460;
            margin-bottom: 15px;
            text-align: center;
            font-size: 20px;
        }
        .formulario label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 16px;
            font-weight: bold;
        }
        .formulario input, .formulario select {
            width: 100%;
            padding: 15px;
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 17px;
            margin-bottom: 15px;
        }
        .formulario input:focus, .formulario select:focus {
            outline: none;
            border-color: #f4a460;
        }
        
        .opciones-servicio {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .opcion-servicio {
            flex: 1;
            padding: 15px;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .opcion-servicio.seleccionada {
            border-color: #4CAF50;
            background-color: #1a2a1a;
        }
        
        /* MENSAJE DE ÉXITO */
        .exito {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.95);
            z-index: 100;
            padding: 20px;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .exito.visible { display: flex; }
        .exito-contenido {
            background-color: #121212;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
        }
        .exito h2 { color: #4CAF50; font-size: 28px; margin-bottom: 15px; }
        .exito p { color: #ccc; font-size: 16px; margin-bottom: 10px; }
        .exito .numero {
            color: #f4a460;
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        }
        .exito button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🍽️ MDK SHAWARMA</h1>
    <p>Hacé tu pedido desde el celular</p>
</div>

<div class="content" id="contenido">
    <!-- Productos se cargan con JavaScript -->
</div>

<div class="carrito-fijo" id="carrito-fijo">
    <div class="carrito-total">
        <span class="label">TOTAL:</span>
        <span class="monto" id="total">$0</span>
    </div>
    <button class="btn-confirmar" id="btn-confirmar" onclick="mostrarFormulario()" disabled>
        📝 COMPLETAR PEDIDO
    </button>
</div>

<div class="formulario" id="formulario" style="display: none;">
    <h2>👤 Tus datos</h2>
    <label>Nombre completo:</label>
    <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
    
    <label>Teléfono:</label>
    <input type="tel" id="telefono" placeholder="Ej: 1123456789">
    
    <label>¿Dónde vas a comer?</label>
    <div class="opciones-servicio">
        <div class="opcion-servicio" onclick="elegirServicio('local', this)">🍽️ En el local</div>
        <div class="opcion-servicio" onclick="elegirServicio('para_llevar', this)">🥡 Para llevar</div>
    </div>
    
    <label>¿Cómo vas a pagar?</label>
    <select id="metodo_pago">
        <option value="">Seleccionar...</option>
        <option value="aguardar">Aguardá a ser llamado</option>
        <option value="mercadopago">MercadoPago</option>
    </select>
    
    <label>Anotaciones (opcional):</label>
    <input type="text" id="notas" placeholder="Ej: sin cebolla">
    
    <button class="btn-confirmar" onclick="confirmarPedido()">✅ CONFIRMAR PEDIDO</button>
    <button class="btn-confirmar" style="background-color:#555; margin-top:10px;" onclick="volverAlMenu()">← Volver al menú</button>
</div>

<div class="exito" id="exito">
    <div class="exito-contenido">
        <h2>✅ ¡Pedido Confirmado!</h2>
        <p>Gracias <span id="nombre-exito"></span></p>
        <p>Tu pedido fue enviado a la cocina</p>
        <div class="numero">N° <span id="numero-pedido"></span></div>
        <p>🔔 Aguardá a ser llamado</p>
        <button onclick="nuevoPedido()">Hacer otro pedido</button>
    </div>
</div>

<script>
    const productos = {{ productos_json | safe }};
    
    let cantidades = {};
    let personalizaciones = {};
    let servicioSeleccionado = '';

    productos.forEach(p => {
        cantidades[p.id] = 0;
        personalizaciones[p.id] = [];
    });

    // Detectar tipo de producto
    function getTipoPersonalizacion(nombre) {
        const n = nombre.toLowerCase();
        if (n.includes('shawarma') || n.includes('falafel')) {
            return {
                titulo: '🧂 ¿Qué querés sacarle?',
                opciones: ['Sin repollo', 'Sin tomate', 'Sin cebolla', 'Sin salsa']
            };
        }
        if (n.includes('coca')) {
            return {
                titulo: '🥤 Elegí el tipo',
                opciones: ['Normal', 'Zero']
            };
        }
        if (n.includes('agua')) {
            return {
                titulo: '💧 Elegí el tipo',
                opciones: ['Con gas', 'Sin gas']
            };
        }
        return null;
    }

    // Orden de importancia
    function ordenImportancia(nombre) {
        const n = nombre.toLowerCase();
        if (n.includes('shawarma') && !n.includes('combo')) return 0;
        if (n.includes('falafel') && !n.includes('combo')) return 1;
        if (n.includes('fatay') && !n.includes('combo')) return 2;
        if (n.includes('humus')) return 3;
        if (n.includes('kebbe')) return 4;
        if (n.includes('combo')) return 5;
        if (n.includes('papas')) return 6;
        if (n.includes('nuggets')) return 7;
        if (n.includes('postre') || n.includes('helado') || n.includes('deditos') || n.includes('baklava')) return 8;
        return 9;
    }

    function renderizarProductos() {
        const contenedor = document.getElementById('contenido');
        contenedor.innerHTML = '';

        // Ordenar productos por importancia
        const productosOrdenados = [...productos].sort((a, b) => {
            const ordenA = ordenImportancia(a.nombre);
            const ordenB = ordenImportancia(b.nombre);
            if (ordenA !== ordenB) return ordenA - ordenB;
            return a.nombre.localeCompare(b.nombre);
        });

        // Agrupar por categoría
        const categorias = {};
        productosOrdenados.forEach(p => {
            let cat = p.categoria.toUpperCase();
            if (cat.includes('BEBIDA')) cat = 'BEBIDAS';
            if (cat.includes('COMIDA')) cat = 'PLATOS PRINCIPALES';
            if (cat.includes('POSTRE')) cat = 'POSTRES';
            
            if (!categorias[cat]) categorias[cat] = [];
            categorias[cat].push(p);
        });

        // Orden de categorías
        const ordenCategorias = ['PLATOS PRINCIPALES', 'COMIDAS', 'POSTRES', 'BEBIDAS'];
        const categoriasOrdenadas = Object.keys(categorias).sort((a, b) => {
            const ia = ordenCategorias.indexOf(a);
            const ib = ordenCategorias.indexOf(b);
            if (ia === -1 && ib === -1) return a.localeCompare(b);
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
        });

        categoriasOrdenadas.forEach(cat => {
            const titulo = document.createElement('div');
            titulo.className = 'categoria-titulo';
            titulo.textContent = cat;
            contenedor.appendChild(titulo);

            categorias[cat].forEach(prod => {
                const div = document.createElement('div');
                div.className = 'producto';
                div.id = 'producto-' + prod.id;
                
                const personalizacion = getTipoPersonalizacion(prod.nombre);
                let personalizacionHTML = '';
                
                if (personalizacion) {
                    personalizacionHTML = `
                        <div class="personalizacion" id="pers-${prod.id}">
                            <div class="personalizacion-titulo">${personalizacion.titulo}</div>
                            <div class="opciones-grid">
                                ${personalizacion.opciones.map(op => `
                                    <div class="opcion-check" onclick="toggleOpcion(${prod.id}, '${op}', this)">${op}</div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                
                div.innerHTML = `
                    <div class="producto-header">
                        <div class="producto-info">
                            <div class="producto-nombre">${prod.nombre}</div>
                            <div class="producto-precio">$${prod.precio.toLocaleString()}</div>
                        </div>
                        <div class="cantidad-control">
                            <button class="btn-cantidad btn-restar" onclick="restar(${prod.id})" id="restar-${prod.id}" disabled>−</button>
                            <span class="cantidad" id="cantidad-${prod.id}">0</span>
                            <button class="btn-cantidad btn-sumar" onclick="sumar(${prod.id})">+</button>
                        </div>
                    </div>
                    ${personalizacionHTML}
                `;
                contenedor.appendChild(div);
            });
        });
    }

    function toggleOpcion(id, opcion, elemento) {
        const lista = personalizaciones[id];
        const index = lista.indexOf(opcion);
        
        if (index === -1) {
            lista.push(opcion);
            elemento.classList.add('seleccionada');
        } else {
            lista.splice(index, 1);
            elemento.classList.remove('seleccionada');
        }
    }

    function sumar(id) {
        cantidades[id]++;
        actualizarInterfaz();
    }

    function restar(id) {
        if (cantidades[id] > 0) {
            cantidades[id]--;
            actualizarInterfaz();
        }
    }

    function actualizarInterfaz() {
        let total = 0;
        let hayProductos = false;

        productos.forEach(prod => {
            const cant = cantidades[prod.id] || 0;
            const cantidadSpan = document.getElementById('cantidad-' + prod.id);
            const productDiv = document.getElementById('producto-' + prod.id);
            const btnRestar = document.getElementById('restar-' + prod.id);
            const persDiv = document.getElementById('pers-' + prod.id);
            
            if (cantidadSpan) cantidadSpan.textContent = cant;
            if (btnRestar) btnRestar.disabled = cant === 0;
            
            if (productDiv) {
                if (cant > 0) {
                    productDiv.classList.add('activo');
                    if (persDiv) persDiv.classList.add('visible');
                } else {
                    productDiv.classList.remove('activo');
                    if (persDiv) persDiv.classList.remove('visible');
                }
            }

            if (cant > 0) {
                total += prod.precio * cant;
                hayProductos = true;
            }
        });

        document.getElementById('total').textContent = '$' + total.toLocaleString();
        document.getElementById('btn-confirmar').disabled = !hayProductos;
    }

    function mostrarFormulario() {
        document.getElementById('contenido').style.display = 'none';
        document.querySelectorAll('.categoria-titulo').forEach(e => e.style.display = 'none');
        document.getElementById('formulario').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function volverAlMenu() {
        document.getElementById('contenido').style.display = 'block';
        document.querySelectorAll('.categoria-titulo').forEach(e => e.style.display = 'block');
        document.getElementById('formulario').style.display = 'none';
        window.scrollTo(0, 0);
    }

    function elegirServicio(tipo, elemento) {
        servicioSeleccionado = tipo;
        document.querySelectorAll('.opcion-servicio').forEach(e => e.classList.remove('seleccionada'));
        elemento.classList.add('seleccionada');
    }

    function confirmarPedido() {
        const nombre = document.getElementById('nombre').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const metodo = document.getElementById('metodo_pago').value;
        const notas = document.getElementById('notas').value;

        if (!nombre) { alert('Por favor, ingresá tu nombre'); return; }
        if (!telefono) { alert('Por favor, ingresá tu teléfono'); return; }
        if (!servicioSeleccionado) { alert('Elegí si vas a comer en el local o para llevar'); return; }
        if (!metodo) { alert('Elegí el método de pago'); return; }

        const carrito = [];
        productos.forEach(prod => {
            if (cantidades[prod.id] > 0) {
                const opciones = personalizaciones[prod.id] || [];
                carrito.push({
                    id: prod.id,
                    nombre: prod.nombre,
                    precio: prod.precio,
                    cantidad: cantidades[prod.id],
                    notas: opciones.join(', ')
                });
            }
        });

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/nuevo_pedido';
        
        const campos = {
            nombre: nombre,
            telefono: telefono,
            tipo_servicio: servicioSeleccionado,
            mesa: '',
            metodo_pago: metodo,
            notas: notas,
            carrito: JSON.stringify(carrito)
        };

        Object.keys(campos).forEach(key => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = campos[key];
            form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
    }

    function nuevoPedido() {
        location.reload();
    }

    renderizarProductos();
    actualizarInterfaz();
</script>

</body>
</html>
