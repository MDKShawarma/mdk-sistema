<!-- PWA - Service Worker -->
<!-- ============================================ -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => console.log('✅ PWA registrada'))
      .catch(err => console.log('❌ Error PWA:', err));
  }
</script>
