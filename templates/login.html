<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IA Solutions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #121212; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background-color: #1e1e1e; border: 1px solid #333; border-radius: 15px; padding: 40px; text-align: center; max-width: 400px; width: 90%; }
        .login-container h1 { color: #f4a460; font-size: 28px; margin-bottom: 10px; }
        .login-container p { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; background-color: #2a2a2a; color: white; border: 1px solid #f4a460; border-radius: 6px; font-size: 16px; margin-bottom: 15px; text-align: center; }
        button { background-color: #f4a460; color: #121212; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
        .error { color: #f44336; font-size: 14px; margin-bottom: 10px; }
        .btn-empleado { background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; margin-top: 10px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 IA Solutions</h1>
        <p>Ingresá la contraseña para continuar</p>
        
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        
        <form method="POST">
            <input type="password" name="contrasena" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        
        <a href="/empleado" class="btn-empleado">👨‍🍳 Soy Empleado</a>
    </div>
</body>
</html>
