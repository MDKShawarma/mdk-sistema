<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDK Shawarma - Ingreso</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-container {
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border: 3px solid #f4a460;
            border-radius: 25px;
            padding: 50px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(244, 164, 96, 0.4);
            animation: fadeIn 0.6s ease;
        }
        
        .login-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #f4a460;
            box-shadow: 0 0 30px rgba(244, 164, 96, 0.6);
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(244, 164, 96, 0.6); }
            50% { box-shadow: 0 0 50px rgba(244, 164, 96, 0.9); }
        }
        
        .login-container h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f4a460, #d4a017);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        
        .login-container .subtitulo {
            color: #d4a017;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        
        .password-input {
            width: 100%;
            padding: 16px;
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #444;
            border-radius: 12px;
            font-size: 17px;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 3px;
            transition: all 0.3s;
        }
        
        .password-input:focus {
            outline: none;
            border-color: #f4a460;
            box-shadow: 0 0 20px rgba(244, 164, 96, 0.4);
        }
        
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #f4a460, #d4a017);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(244, 164, 96, 0.5);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error {
            color: #f44336;
            font-size: 14px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/static/logo.png" alt="MDK Logo" class="login-logo">
        <h1>MDK SHAWARMA</h1>
        <div class="subtitulo">Maison du Kebab</div>
        
        <form method="POST" action="/login">
            <input type="password" name="contrasena" class="password-input" placeholder="Contraseña" required autofocus>
            <button type="submit" class="btn-login">🔐 INGRESAR</button>
        </form>
        
        {% if error %}
        <p class="error">⚠️ {{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
