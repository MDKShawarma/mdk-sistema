<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - MDK Shawarma</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #4CAF50; font-size: 32px; margin-bottom: 20px; }
        .info {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: 20px auto;
            border: 2px solid #f4a460;
            box-shadow: 0 10px 40px rgba(244, 164, 96, 0.3);
        }
        .numero {
            font-size: 60px;
            color: #f4a460;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 10px rgba(244, 164, 96, 0.5);
        }
        .label-pedido {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        a {
            color: #f4a460;
            text-decoration: none;
            font-size: 16px;
            margin-top: 20px;
            display: inline-block;
            padding: 12px 25px;
            border: 2px solid #f4a460;
            border-radius: 10px;
            transition: all 0.3s;
        }
        a:hover { background: #f4a460; color: #121212; }
        .mensaje { font-size: 16px; margin: 10px 0; color: #ccc; }
    </style>
</head>
<body>
    <h1>✅ ¡Pedido Confirmado!</h1>
    <div class="info">
        <p class="mensaje">Gracias <strong>{{ nombre }}</strong>,</p>
        <p class="mensaje">Tu pedido fue enviado a la cocina</p>
        <div class="label-pedido">Número de Pedido</div>
        <div class="numero">N° {{ numero_pedido }}</div>
        <p class="mensaje">🔔 Aguardá a ser llamado</p>
    </div>
    <a href="/pedido">← Hacer otro pedido</a>
</body>
</html>
