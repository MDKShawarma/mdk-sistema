<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - MDK Shawarma</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .form-cliente {
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .form-cliente h2 {
            color: #f4a460;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-cliente input {
            width: 100%;
            padding: 14px;
            background-color: #1a1a1a;
            color: white;
            border: 2px solid #444;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        .form-cliente input:focus {
            outline: none;
            border-color: #f4a460;
            box-shadow: 0 0 15px rgba(244, 164, 96, 0.3);
        }
        .form-cliente button {
            width: 100%;
            background: linear-gradient(135deg, #f4a460, #d4a017);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-cliente button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 164, 96, 0.4);
        }
        
        .clientes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }
        
        .cliente-card {
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .cliente-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(244, 164, 96, 0.15), transparent);
            transition: left 0.5s;
        }
        
        .cliente-card:hover::before { left: 100%; }
        
        .cliente-card:hover {
            transform: translateY(-5px);
            border-color: #f4a460;
            box-shadow: 0 10px 30px rgba(244, 164, 96, 0.3);
        }
        
        .cliente-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .cliente-card .telefono {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .cliente-card .compras {
            font-size: 26px;
            font-weight: bold;
            background: linear-gradient(90deg, #4CAF50, #2d7a4a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .cliente-card .pedidos {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }
        
        .btn-ver {
            display: inline-block;
            background: linear-gradient(135deg, #4CAF50, #2d7a4a);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin-right: 5px;
        }
        
        .btn-ver:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        
        .btn-eliminar {
            background: linear-gradient(135deg, #f44336, #8a2d2d);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-eliminar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <img src="/static/logo.png" alt="MDK Logo">
            <h2>MDK SHAWARMA</h2>
        </div>
        <div class="header-subtitle">Maison du Kebab</div>
    </div>
    
    <div class="menu">
        <a href="/">📊 Panel</a>
        <a href="/productos">📦 Productos</a>
        <a href="/stock">🔄 Stock</a>
        <a href="/ventas">💰 Ventas</a>
        <a href="/gastos">💸 Gastos</a>
        <a href="/gastos_fijos">📋 Fijos</a>
        <a href="/contador">🧾 Contador</a>
        <a href="/informe">📈 Informe</a>
        <a href="/proveedores">📞 Proveedores</a>
        <a href="/chat">💬 Chat</a>
        <a href="/clientes">👥 Clientes</a>
    </div>
    
    <div class="content">
        <h1>👥 Clientes</h1>
        
        <div class="form-cliente">
            <h2>➕ Registrar Cliente</h2>
            <form method="POST" action="/clientes">
                <input type="text" name="nombre" placeholder="Nombre del cliente" required>
                <input type="text" name="telefono" placeholder="Teléfono" required>
                <button type="submit">Guardar Cliente</button>
            </form>
        </div>
        
        <div class="clientes-grid">
            {% for c in clientes %}
            <div class="cliente-card">
                <h3>{{ c[1] }}</h3>
                <div class="telefono">📞 {{ c[2] }}</div>
                <div class="compras">${{ c[3] }}</div>
                <div class="pedidos">{{ c[4] }} pedidos</div>
                <a href="/cliente/{{ c[0] }}" class="btn-ver">Ver Historial</a>
                <form method="POST" action="/eliminar_cliente/{{ c[0] }}" style="display:inline;" onsubmit="return confirm('¿Eliminar este cliente?');">
                    <button type="submit" class="btn-eliminar">🗑️</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
